
name: Build Metagram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Telegram sources
        run: git clone --recursive --shallow-submodules https://github.com/DrKLO/Telegram.git src

      - name: Metagram branding
        run: |
          cd src
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=com.metagram.messenger/' gradle.properties
          find TMessagesProj/src/main/res -name strings.xml -exec sed -i 's|<string name="AppName">[^<]*</string>|<string name="AppName">Metagram</string>|g' {} +
          cat > TMessagesProj/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://metagram-default-rtdb.firebaseio.com",
              "project_id": "metagram",
              "storage_bucket": "metagram.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.metagram.messenger" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA1234567890abcdefghijklmnopqrst" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": { "package_name": "com.metagram.messenger.beta" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA1234567890abcdefghijklmnopqrst" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          cp TMessagesProj/google-services.json google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f | sort | tail -n 1)
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build APK
        run: cd src && chmod +x gradlew &&./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metagram-apk
          path: src/TMessagesProj/build/outputs/apk/**/*.apk
